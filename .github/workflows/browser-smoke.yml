name: FLAMES Browser Smoke
on:
  push:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start local server
        run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - name: Run responsive browser smoke
        run: node test/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flames-browser-screenshot
          path: flames-mobile.png
          if-no-files-found: ignore
